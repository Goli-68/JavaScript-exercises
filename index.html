<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hogwarts House generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="holder">
      <h1>🪄🪄Hogwarts House generator🪄🪄</h1>
      <p>Type your name to discover your Hogwarts House!</p>
      <input id="name-input" type="text" placeholder="Enter your name" />
      <button id="sort-btn" type="button" placeholder="writes your name">
        Hogwarts House
      </button>
      <button id="try-again-btn" type="button" style="display: none">
        Try again
      </button>
      <p id="result"></p>
    </div>
    <script src="index.js" defer></script>
  </body>
</html>
